name: Desktop validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Desktop smoke test
        timeout-minutes: 2
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Linux desktop smoke test
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - name: Package without publishing
        run: npm run dist -- --publish never "-c.linux.maintainer=w00c00 <46839097+w00c00@users.noreply.github.com>"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged source matches this commit
        run: node scripts/verify-packaged-source.cjs --dist "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kaspa-orbit-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
