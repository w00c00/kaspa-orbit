name: KCC20 script engine
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/kcc20*.cjs'
      - 'desktop/covenant-*.cjs'
      - 'desktop/utxo-identity.cjs'
      - 'test/engine/**'
      - 'test/fixtures/kcc20-2433.json'
      - 'test/fixtures/kcc20-v1-probe.sil'
      - 'test/fixtures/silverscript-v1-args.json'
      - 'scripts/*kcc20*'
      - 'package*.json'
      - '.github/workflows/kcc20-engine.yml'
  pull_request:
    paths:
      - 'desktop/kcc20*.cjs'
      - 'desktop/covenant-*.cjs'
      - 'desktop/utxo-identity.cjs'
      - 'test/engine/**'
      - 'test/fixtures/kcc20-2433.json'
      - 'test/fixtures/kcc20-v1-probe.sil'
      - 'test/fixtures/silverscript-v1-args.json'
      - 'scripts/*kcc20*'
      - 'package*.json'
      - '.github/workflows/kcc20-engine.yml'
permissions:
  contents: read
jobs:
  script-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: kaspanet/silverscript
          ref: 3ed973335b59269293564805cc2c58a14595ec03 # SilverScript v1.0.0
          path: upstream-silverscript
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream-silverscript
      - name: Execute synthetic signed transactions and adversarial cases
        run: node scripts/run-kcc20-engine.cjs upstream-silverscript
